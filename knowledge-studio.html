<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识转盘 · Knowledge Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0D0D0D;
      --surface: #111111;
      --surface-2: #161616;
      --border: #1E1E1E;
      --border-2: #2A2A2A;
      --text: #E8E0D5;
      --text-muted: #888888;
      --text-dim: #555555;
      --text-faint: #333333;
      --accent: #E8E0D5;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 2px; }

    /* ── Layout ── */
    header {
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,13,13,0.92);
      backdrop-filter: blur(12px);
    }
    .header-inner {
      max-width: 680px; margin: 0 auto;
      padding: 18px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo-title {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--text);
    }
    .logo-sub {
      font-size: 10px; color: var(--text-faint);
      letter-spacing: 0.1em; margin-top: 3px;
    }
    .btn-reset {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text-dim);
      letter-spacing: 0.1em; background: none; border: none;
      cursor: pointer; transition: color 0.2s;
    }
    .btn-reset:hover { color: var(--text-muted); }
    .btn-reset svg { width: 12px; height: 12px; }

    main {
      flex: 1; max-width: 680px;
      margin: 0 auto; width: 100%;
      padding: 40px 24px;
      display: flex; flex-direction: column; gap: 32px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px;
      text-align: center;
      font-size: 10px; color: #222;
      letter-spacing: 0.12em; text-transform: uppercase;
    }

    /* ── Step Indicator ── */
    .steps {
      display: flex; align-items: center; width: 100%;
    }
    .step-item {
      display: flex; flex-direction: column;
      align-items: center; gap: 6px; flex: 1;
    }
    .step-icon {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid #222; transition: all 0.3s;
    }
    .step-icon.active {
      background: var(--accent); border-color: transparent;
    }
    .step-icon.done {
      background: #1A1A1A; border-color: #333;
    }
    .step-icon svg { width: 14px; height: 14px; }
    .step-icon.active svg { color: #111; }
    .step-icon.done svg { color: #666; }
    .step-icon:not(.active):not(.done) svg { color: #2A2A2A; }
    .step-label {
      font-size: 9px; letter-spacing: 0.06em;
      text-align: center; white-space: nowrap;
    }
    .step-label.active { color: var(--text); }
    .step-label.done { color: #444; }
    .step-label:not(.active):not(.done) { color: #222; }
    .step-connector {
      flex: 1; height: 1px;
      max-width: 40px; margin-bottom: 16px;
    }
    @media (max-width: 480px) {
      .step-label { display: none; }
    }

    /* ── Section Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
    }
    .card-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px;
    }
    .card-bar {
      width: 3px; height: 16px;
      background: var(--accent);
      flex-shrink: 0;
    }
    .card-title {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Spin Wheel Step ── */
    .spin-intro { text-align: center; }
    .spin-intro h2 {
      font-size: 26px; font-weight: 300;
      letter-spacing: 0.06em; margin-bottom: 12px;
      color: var(--text);
    }
    .spin-intro p {
      font-size: 13px; color: var(--text-dim);
      line-height: 1.9; max-width: 380px; margin: 0 auto;
    }
    .wheel-wrap {
      display: flex; flex-direction: column;
      align-items: center; gap: 24px;
    }
    .canvas-wrap { position: relative; }
    canvas { display: block; border-radius: 50%; }
    .pointer {
      position: absolute; top: 50%; right: -2px;
      transform: translateY(-50%);
      width: 0; height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-right: 22px solid var(--accent);
    }
    .btn-spin {
      padding: 11px 36px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      background: var(--accent); color: #111;
      border: none; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-spin:disabled {
      background: #1E1E1E; color: #444; cursor: not-allowed;
    }
    .cat-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .cat-tag {
      padding: 10px;
      text-align: center;
      font-size: 11px; letter-spacing: 0.05em;
      background: #0E0E0E; border: 1px solid #1A1A1A;
      color: var(--text-dim);
    }

    /* ── Concept Card ── */
    .concept-card {
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      padding: 24px;
    }
    .concept-badge {
      display: inline-block;
      padding: 4px 10px; font-size: 10px;
      font-weight: 500; letter-spacing: 0.1em;
      margin-bottom: 16px; border: 1px solid;
    }
    .concept-name {
      font-size: 24px; font-weight: 300;
      letter-spacing: 0.05em; margin-bottom: 12px;
      color: var(--text);
    }
    .concept-desc {
      font-size: 13px; color: #666; line-height: 1.9;
    }

    /* ── Timer ── */
    .timer-wrap {
      display: flex; flex-direction: column;
      align-items: center; gap: 24px;
    }
    .timer-hint {
      font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-dim);
      text-align: center; margin-bottom: 8px;
    }
    .timer-ring { position: relative; }
    .timer-ring svg { display: block; }
    .timer-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .timer-digits {
      font-size: 30px; font-weight: 300;
      letter-spacing: 0.06em; color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .timer-label {
      font-size: 10px; color: #555;
      letter-spacing: 0.12em; margin-top: 4px;
    }
    .timer-done-msg {
      font-size: 13px; color: var(--text-muted);
      letter-spacing: 0.05em; text-align: center;
    }

    /* ── Buttons ── */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase;
      background: var(--accent); color: #111;
      border: none; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px;
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      background: #1A1A1A; color: #666;
      border: 1px solid #2A2A2A; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover { color: #888; }
    .btn-icon {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px;
      background: var(--accent); color: #111;
      border: none; cursor: pointer; flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .btn-icon:hover { opacity: 0.85; }
    .btn-icon svg { width: 14px; height: 14px; }

    /* ── Dialog / Chat ── */
    .dialog-area {
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      padding: 14px 16px;
      font-size: 13px; line-height: 1.85;
    }
    .msg-ai {
      background: var(--surface-2); color: #AAA;
      border-left: 2px solid var(--border-2);
    }
    .msg-user {
      background: #1C1C1C; color: #CCC;
    }
    .input-row {
      display: flex; gap: 8px; align-items: flex-end;
    }
    textarea {
      flex: 1; padding: 12px 14px;
      font-size: 13px; line-height: 1.8;
      background: #111; color: #CCC;
      border: 1px solid var(--border-2);
      resize: none; outline: none;
      font-family: inherit;
      min-height: 88px;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #3A3A3A; }
    textarea::placeholder { color: #3A3A3A; }
    .scroll-box {
      max-height: 320px; overflow-y: auto;
      padding-right: 4px;
      display: flex; flex-direction: column; gap: 10px;
    }

    /* ── Deep Explain Accordion ── */
    .deep-hint {
      font-size: 10px; color: #444;
      letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 12px;
    }
    .accordion { display: flex; flex-direction: column; gap: 6px; }
    .acc-item { border: 1px solid var(--border-2); }
    .acc-trigger {
      width: 100%; display: flex;
      align-items: center; justify-content: space-between;
      padding: 14px 16px;
      background: var(--bg); border: none; cursor: pointer;
      text-align: left; transition: background 0.2s;
    }
    .acc-trigger.open { background: var(--surface-2); }
    .acc-trigger-label {
      font-size: 12px; font-weight: 500;
      letter-spacing: 0.06em;
      color: #666; transition: color 0.2s;
    }
    .acc-trigger.open .acc-trigger-label { color: var(--text); }
    .acc-trigger svg { width: 13px; height: 13px; color: #3A3A3A; flex-shrink: 0; }
    .acc-content {
      padding: 14px 16px;
      font-size: 13px; color: #999; line-height: 1.9;
      background: var(--surface-2);
      border-top: 1px solid #1E1E1E;
      display: none;
    }
    .acc-content.open { display: block; }

    /* ── Complete Banner ── */
    .complete-banner {
      padding: 28px 24px;
      text-align: center;
      background: #091209; border: 1px solid #152315;
    }
    .complete-title {
      font-size: 13px; color: #7AB87A;
      letter-spacing: 0.06em; margin-bottom: 6px;
    }
    .complete-sub {
      font-size: 11px; color: #4A7A4A;
      margin-bottom: 20px;
    }

    /* ── Check badge ── */
    .check-badge {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      background: #091209; color: #7AB87A;
      font-size: 13px;
    }
    .check-badge svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── Intro label ── */
    .intro-label {
      font-size: 13px; color: var(--text-muted);
      line-height: 1.85; margin-bottom: 16px;
    }
    .intro-label span { color: var(--text); }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      main { padding: 28px 16px; gap: 24px; }
      .header-inner { padding: 14px 16px; }
      .card { padding: 18px 16px; }
      .concept-card { padding: 18px 16px; }
      .concept-name { font-size: 20px; }
      .cat-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      canvas { width: 240px !important; height: 240px !important; }
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="header-inner">
    <div>
      <div class="logo-title">知识转盘</div>
      <div class="logo-sub">Personal Knowledge Studio</div>
    </div>
    <button class="btn-reset" id="btnReset" style="display:none" onclick="resetAll()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      重新开始
    </button>
  </div>
</header>

<!-- ── Main ── -->
<main>

  <!-- Step Indicator -->
  <div class="steps" id="stepIndicator"></div>

  <!-- ── STEP 0: Spin ── -->
  <div id="view-spin">
    <div class="spin-intro" style="margin-bottom:32px">
      <h2>今天学什么？</h2>
      <p>转动转盘，从38个精选知识概念中随机抽取，开启15分钟不借助AI的深度学习之旅。</p>
    </div>
    <div class="wheel-wrap">
      <div class="canvas-wrap">
        <canvas id="wheelCanvas" width="280" height="280"></canvas>
        <div class="pointer"></div>
      </div>
      <button class="btn-spin" id="btnSpin" onclick="spinWheel()">转动转盘</button>
    </div>
    <div class="cat-grid" style="margin-top:28px">
      <div class="cat-tag">食 · 住 · 健康</div>
      <div class="cat-tag">中国史 · 世界史</div>
      <div class="cat-tag">法律 · 地理 · 博物</div>
    </div>
  </div>

  <!-- ── STEP 1: Study ── -->
  <div id="view-study" style="display:none">
    <div id="conceptCard1"></div>
    <div class="card" style="margin-top:20px">
      <div class="timer-hint">不借助 AI · 15分钟自主探索</div>
      <div class="timer-wrap">
        <div class="timer-ring">
          <svg width="160" height="160" style="transform:rotate(-90deg)">
            <circle cx="80" cy="80" r="68" fill="none" stroke="#1A1A1A" stroke-width="4"/>
            <circle id="timerArc" cx="80" cy="80" r="68" fill="none" stroke="#E8E0D5"
              stroke-width="4" stroke-linecap="round"
              stroke-dasharray="427.256"
              stroke-dashoffset="427.256"/>
          </svg>
          <div class="timer-center">
            <div class="timer-digits" id="timerDisplay">15:00</div>
            <div class="timer-label">自主学习</div>
          </div>
        </div>
        <div id="timerBtns">
          <button class="btn-primary" id="btnStart" onclick="startTimer()">
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            开始计时
          </button>
        </div>
        <p class="timer-done-msg" id="timerDoneMsg" style="display:none">学习时间结束，请分享你的认知。</p>
      </div>
    </div>
  </div>

  <!-- ── STEP 2: Socratic ── -->
  <div id="view-socratic" style="display:none">
    <div id="conceptCard2"></div>
    <div class="card" style="margin-top:20px">
      <div class="card-header">
        <div class="card-bar"></div>
        <div class="card-title">苏格拉底追问</div>
      </div>
      <!-- Initial input -->
      <div id="socInitial">
        <p class="intro-label" id="socIntroText"></p>
        <textarea id="socInitialInput" placeholder="写下你对这个概念的初步认识..."></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:10px">
          <button class="btn-primary" onclick="startSocratic()">
            开始追问
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
      <!-- Dialog -->
      <div id="socDialog" style="display:none">
        <div class="scroll-box" id="socScrollBox"></div>
        <div class="input-row" style="margin-top:12px" id="socInputRow">
          <textarea id="socInput" placeholder="回答这个问题..." style="min-height:72px"></textarea>
          <button class="btn-icon" onclick="submitSocratic()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── STEP 3: Feynman ── -->
  <div id="view-feynman" style="display:none">
    <div id="conceptCard3"></div>
    <div class="card" style="margin-top:20px">
      <div class="card-header">
        <div class="card-bar"></div>
        <div class="card-title">费曼检验</div>
      </div>
      <p class="intro-label" id="feynmanIntroText"></p>
      <div class="dialog-area" id="feynmanHistory"></div>
      <div id="feynmanPassed" style="display:none">
        <div class="check-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          费曼检验通过。你已真正掌握这个概念。
        </div>
      </div>
      <div class="input-row" style="margin-top:12px" id="feynmanInputRow">
        <textarea id="feynmanInput" placeholder="用最简单的语言解释这个概念..." style="min-height:88px"></textarea>
        <button class="btn-icon" onclick="submitFeynman()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ── STEP 4: Deep Explain ── -->
  <div id="view-deep" style="display:none">
    <div id="conceptCard4"></div>
    <div class="card" style="margin-top:20px">
      <div class="card-header">
        <div class="card-bar"></div>
        <div class="card-title">深度讲解</div>
      </div>
      <p class="deep-hint">三层递进 · 由浅入深</p>
      <div class="accordion" id="deepAccordion"></div>
    </div>
    <div class="complete-banner" style="margin-top:20px">
      <div class="complete-title" id="completeTitleText"></div>
      <div class="complete-sub" id="completeSubText"></div>
      <button class="btn-primary" onclick="resetAll()">开始新的学习</button>
    </div>
  </div>

</main>

<footer>KNOWLEDGE STUDIO · 每次15分钟 · 持续精进</footer>

<script>

// WHEEL
// ════════════════════════════════════════════
const WHEEL_SEGMENTS = 12;
const WHEEL_COLORS = ['#222','#2C2C2C','#181818','#282828','#202020','#303030','#1A1A1A','#262626','#242424','#2E2E2E','#1C1C1C','#2A2A2A'];
const WHEEL_CATS = ['食·烹饪','食·生活','住·金融','住·建筑','健康·心理','健康·运动','中国史','世界史','法律','地理','博物','古书'];
let wheelRotation = 0;
let wheelSpinning = false;

function drawWheel(rot) {
  const canvas = document.getElementById('wheelCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const c = size / 2;
  const r = c - 8;
  ctx.clearRect(0, 0, size, size);
  const segAngle = (2 * Math.PI) / WHEEL_SEGMENTS;
  for (let i = 0; i < WHEEL_SEGMENTS; i++) {
    const sa = rot + i * segAngle;
    const ea = sa + segAngle;
    ctx.beginPath();
    ctx.moveTo(c, c);
    ctx.arc(c, c, r, sa, ea);
    ctx.closePath();
    ctx.fillStyle = WHEEL_COLORS[i];
    ctx.fill();
    ctx.strokeStyle = '#0D0D0D';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(sa + segAngle / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#666';
    ctx.font = '500 9px -apple-system, sans-serif';
    ctx.fillText(WHEEL_CATS[i], r - 14, 4);
    ctx.restore();
  }
  // Ring
  ctx.beginPath();
  ctx.arc(c, c, r, 0, 2 * Math.PI);
  ctx.strokeStyle = '#1A1A1A';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Center
  ctx.beginPath();
  ctx.arc(c, c, 26, 0, 2 * Math.PI);
  ctx.fillStyle = '#0D0D0D';
  ctx.fill();
  ctx.strokeStyle = '#2A2A2A';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function spinWheel() {
  if (wheelSpinning) return;
  wheelSpinning = true;
  document.getElementById('btnSpin').disabled = true;
  document.getElementById('btnSpin').textContent = '旋转中...';
  const total = (5 + Math.random() * 5) * 2 * Math.PI + Math.random() * 2 * Math.PI;
  const duration = 3600;
  const start = performance.now();
  const startRot = wheelRotation;
  function animate(now) {
    const elapsed = now - start;
    const p = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - p, 4);
    wheelRotation = startRot + total * eased;
    drawWheel(wheelRotation);
    if (p < 1) {
      requestAnimationFrame(animate);
    } else {
      wheelSpinning = false;
      const finalAngle = ((wheelRotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const pAngle = (Math.PI * 1.5 - finalAngle + 2 * Math.PI) % (2 * Math.PI);
      const segAngle = (2 * Math.PI) / WHEEL_SEGMENTS;
      const segIdx = Math.floor(pAngle / segAngle) % WHEEL_SEGMENTS;
      const catName = WHEEL_CATS[segIdx];
      const prefix = catName.split('·')[0];
      const filtered = CONCEPTS.filter(c => c.category.includes(prefix));
      const pool = filtered.length > 0 ? filtered : CONCEPTS;
      currentConcept = pool[Math.floor(Math.random() * pool.length)];
      setTimeout(() => goToStep(1), 300);
    }
  }
  requestAnimationFrame(animate);
}

function updateTimerDisplay() {
  const mm = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
  const ss = String(timerSeconds % 60).padStart(2, '0');
  document.getElementById('timerDisplay').textContent = `${mm}:${ss}`;
  const progress = 1 - timerSeconds / 900;
  const circumference = 2 * Math.PI * 68;
  const offset = circumference * (1 - progress);
  document.getElementById('timerArc').style.strokeDashoffset = offset;
}

function startTimer() {
  timerRunning = true;
  document.getElementById('timerBtns').innerHTML = `
    <button class="btn-secondary" onclick="stopTimer()">
      <svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      结束学习
    </button>`;
  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0) { clearInterval(timerInterval); timerDone(); }
  }, 1000);
}

function stopTimer() { clearInterval(timerInterval); timerDone(); }

function timerDone() {
  timerRunning = false;
  document.getElementById('timerBtns').style.display = 'none';
  document.getElementById('timerDoneMsg').style.display = 'block';
  setTimeout(() => goToStep(2), 1400);
}

    <div class="acc-item">
      <button class="acc-trigger ${i===0?'open':''}" onclick="toggleAcc(this)" data-idx="${i}">
        <span class="acc-trigger-label">0${i+1}  ${l.layer}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="acc-chevron">
          ${i===0 ? '<polyline points="18 15 12 9 6 15"/>' : '<polyline points="6 9 12 15 18 9"/>'}
        </svg>
      </button>
      <div class="acc-content ${i===0?'open':''}">${l.text}</div>
    </div>`).join('');
}

function toggleAcc(btn) {
  const item = btn.parentElement;
  const content = item.querySelector('.acc-content');
  const isOpen = btn.classList.contains('open');
  btn.classList.toggle('open', !isOpen);
  content.classList.toggle('open', !isOpen);
  const chevron = btn.querySelector('.acc-chevron');
  chevron.innerHTML = !isOpen
    ? '<polyline points="18 15 12 9 6 15"/>'
    : '<polyline points="6 9 12 15 18 9"/>';
}

// ════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════
function goToStep(n) {
  // Hide all views
  ['spin','study','socratic','feynman','deep'].forEach(v => {
    document.getElementById('view-' + v).style.display = 'none';
  });
  currentStep = n;
  renderStepIndicator();
  document.getElementById('btnReset').style.display = n > 0 ? 'flex' : 'none';

  if (n === 0) {
    document.getElementById('view-spin').style.display = 'block';
    document.getElementById('btnSpin').disabled = false;
    document.getElementById('btnSpin').textContent = '转动转盘';
  } else if (n === 1) {
    document.getElementById('view-study').style.display = 'block';
    renderConceptCard('conceptCard1');
  } else if (n === 2) {
    document.getElementById('view-socratic').style.display = 'block';
    renderConceptCard('conceptCard2');
    document.getElementById('socIntroText').innerHTML = `你在15分钟内学习了「<span>${currentConcept.concept}</span>」。<br>请先告诉我，你从这段学习中获得了什么认知？`;
  } else if (n === 3) {
    document.getElementById('view-feynman').style.display = 'block';
    renderConceptCard('conceptCard3');
    document.getElementById('feynmanIntroText').innerHTML = `现在进入 <span>费曼检验</span>。<br>请你像给一个完全不懂的人讲解一样，用最简单的语言解释「<span>${currentConcept.concept}</span>」。`;
  } else if (n === 4) {
    document.getElementById('view-deep').style.display = 'block';
    renderConceptCard('conceptCard4');
    renderDeepExplain();
    document.getElementById('completeTitleText').textContent = '本次学习完成';
    document.getElementById('completeSubText').textContent = `你已完成对「${currentConcept.concept}」的完整学习循环`;
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetAll() {
  clearInterval(timerInterval);
  timerSeconds = 900; timerRunning = false;
  socStep = 0; feynmanRound = 0;
  currentConcept = null;
  // Reset timer UI
  document.getElementById('timerDisplay').textContent = '15:00';
  document.getElementById('timerArc').style.strokeDashoffset = '427.256';
  document.getElementById('timerBtns').style.display = 'flex';
  document.getElementById('timerBtns').innerHTML = `<button class="btn-primary" id="btnStart" onclick="startTimer()"><svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><polygon points="5 3 19 12 5 21 5 3"/></svg>开始计时</button>`;
  document.getElementById('timerDoneMsg').style.display = 'none';
  // Reset socratic
  document.getElementById('socInitial').style.display = 'block';
  document.getElementById('socInitialInput').value = '';
  document.getElementById('socDialog').style.display = 'none';
  document.getElementById('socScrollBox').innerHTML = '';
  document.getElementById('socInputRow').style.display = 'flex';
  // Reset feynman
  document.getElementById('feynmanHistory').innerHTML = '';
  document.getElementById('feynmanInput').value = '';
  document.getElementById('feynmanInputRow').style.display = 'flex';
  document.getElementById('feynmanPassed').style.display = 'none';
  goToStep(0);
}

// ════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════
function addMsg(container, role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'ai' ? 'msg-ai' : 'msg-user');
  div.textContent = text;
  container.appendChild(div);
}
function scrollBox(el) { el.scrollTop = el.scrollHeight; }

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
renderStepIndicator();
drawWheel(0);
</script>
